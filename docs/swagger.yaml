                            type: object
                            properties:
                              name: { type: string, example: "Classic Low-Top Sneaker" }
                              brand: { type: string, example: "Red Tape" }
                              price: { type: number, example: 1199 }

  # AI OUTFIT BUILDER & DAILY STYLIST
