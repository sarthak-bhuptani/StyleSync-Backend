                    type: object
                    properties:
                      monthlyLimit: { type: number, example: 10000 }
                      spentThisMonth: { type: number, example: 3450 }
                      remainingBudget: { type: number, example: 6550 }
                      currency: { type: string, example: "₹" }
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string, example: "Clothing" }
                            allocated: { type: number, example: 4000 }
                            spent: { type: number, example: 1490 }
