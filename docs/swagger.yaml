                  stylingRationale: { type: string, example: "Structured tailored lines balance your athletic build." }

  /api/v1/outfits/log-wear:
    post:
      summary: Outfit Wear Logging
      description: Increments the wearCount of every item included in the outfit and logs the wear timestamp.
