openapi: 3.0.3
info:
  title: StyleSync Backend
  description: Production REST API & AI Vision Advisor Engine for StyleSync
  version: "1.0"
  contact:
    name: StyleSync AI Engineering
servers:
  - url: http://localhost:5000
    description: Local Backend Server (http://localhost:5000)
  - url: /
    description: Current Host Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token generated from /api/v1/auth/login or /api/v1/auth/register

  schemas:
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string, example: "Alex Vance" }
        email: { type: string, example: "alex@stylesync.ai" }
        avatar: { type: string }
        physicalTraits:
          type: object
          properties:
            faceShape: { type: string, example: "Oval" }
            skinUndertone: { type: string, example: "Warm Golden" }
            colorSeason: { type: string, example: "Warm Autumn" }
            bodySilhouette: { type: string, example: "Athletic V-Taper" }
            calibrationConfidence: { type: string, example: "96%" }
            calibrationNotes: { type: string }
        preferences:
          type: object
          properties:
            brandPreferences: { type: array, items: { type: string } }
            sizes: { type: object }
            avoidColors: { type: array, items: { type: string } }
            favoriteStyles: { type: array, items: { type: string } }
            budgetLimits: { type: object }
        isOnboarded: { type: boolean }
        onboardingStep: { type: number }

    WardrobeItem:
      type: object
      properties:
        _id: { type: string }
        userId: { type: string }
        name: { type: string, example: "Merino Wool Crewneck Sweater" }
        category: { type: string, enum: [Tops, Bottoms, Outerwear, Shoes, Accessories, Eyewear, One-Piece, Other], example: "Tops" }
        brand: { type: string, example: "COS" }
        color: { type: string, example: "Forest Green" }
        colorHex: { type: string, example: "#1E3A2F" }
        price: { type: number, example: 110 }
        imageUrl: { type: string }
        wearCount: { type: number, example: 14 }
        costPerWear: { type: number, example: 7.86 }
        season: { type: string, example: "Fall/Winter" }

    AnalyzedProduct:
      type: object
      properties:
        _id: { type: string }
        name: { type: string, example: "Cashmere Ribbed Cardigan" }
        brand: { type: string, example: "Acne Studios" }
        category: { type: string, example: "Tops" }
        price: { type: number, example: 180 }
        color: { type: string, example: "Warm Oatmeal" }
        imageUrl: { type: string }
        score: { type: number, example: 89 }
        decision: { type: string, enum: [BUY, MAYBE, SKIP], example: "BUY" }
        confidence: { type: string, example: "95%" }
        breakdown:
          type: object
          properties:
            styleMatch: { type: object, properties: { score: { type: number }, max: { type: number } } }
            colorMatch: { type: object, properties: { score: { type: number }, max: { type: number } } }
            wardrobeMatch: { type: object, properties: { score: { type: number }, max: { type: number } } }
            versatility: { type: object, properties: { score: { type: number }, max: { type: number } } }
            budget: { type: object, properties: { score: { type: number }, max: { type: number } } }
            occasion: { type: object, properties: { score: { type: number }, max: { type: number } } }
        aiExplanation: { type: string }
        strongMatches: { type: array, items: { type: string } }
        considerations: { type: array, items: { type: string } }
        physicalHarmony:
          type: object
          properties:
            faceMatch: { type: string }
            complexionMatch: { type: string }
            bodyMatch: { type: string }

    Collection:
      type: object
      properties:
        id:
          type: string
          example: "col_123"
        name:
          type: string
          example: "Workwear Capsule"
        category:
          type: string
          example: "Work"
        description:
          type: string
          example: "Smart professional staples for Monday-Thursday"
        coverImage:
          type: string
          example: "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f"
        itemIds:
          type: array
          items:
            type: string
          example: ["item_1", "item_2"]
        outfitIds:
          type: array
          items:
            type: string
          example: ["outfit_1"]
        looks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "look_1"
              title:
                type: string
                example: "Boardroom Power Look"
              items:
                type: array
                items:
                  type: string
                example: ["item_1", "item_2"]
        createdAt:
          type: string
          format: date-time
          example: "2026-10-15T10:00:00Z"

paths:
  # DEFAULT / HEALTH
  /health:
    get:
      summary: Health Check
      description: Returns online status of server, MongoDB, and Gemini Vision AI engine.
      tags: [default]
      responses:
        200:
          description: Service health operational status

  # AUTHENTICATION
  /api/v1/auth/register:
    post:
      summary: Register User
      description: Create a new user profile with name, email, and password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: "Alex Vance" }
                email: { type: string, example: "alex@stylesync.ai" }
                password: { type: string, example: "password123" }
      responses:
        201:
          description: User registered successfully, returns JWT Bearer token
        400:
          description: Validation error or duplicate email

  /api/v1/auth/login:
    post:
      summary: Login User
      description: Authenticate user and receive JWT Bearer token.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "demo@stylesync.ai" }
                password: { type: string, example: "password123" }
      responses:
        200:
          description: Successfully authenticated, returns JWT token and user profile
        401:
          description: Invalid email or password

  /api/v1/auth/me:
    get:
      summary: Get Current Session Profile
      description: Returns the authenticated user profile using Bearer JWT.
      security:
        - BearerAuth: []
      tags: [auth]
      responses:
        200:
          description: Active user session profile
        401:
          description: Unauthorized

  /api/v1/auth/forgot-password:
    post:
      summary: Forgot Password
      description: Dispatches password reset link.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, example: "alex@stylesync.ai" }
      responses:
        200:
          description: Reset link dispatched

  /api/v1/auth/reset-password:
    post:
      summary: Reset Password Completion
      description: Reset password using the reset token sent to email.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, example: "9f82ab..." }
                password: { type: string, example: "newSecurePassword123!" }
      responses:
        200:
          description: Password updated successfully
        400:
          description: Invalid or expired token


  # PROFILE & AI CALIBRATION
  /api/v1/profile:
    get:
      summary: Get User Profile & Physical Traits
      description: Returns user physical traits (faceShape, skinUndertone, colorSeason, bodySilhouette) and styling preferences.
      security:
        - BearerAuth: []
      tags: [profile]
      responses:
        200:
          description: Full profile data
    put:
      summary: Update User Styling Preferences
      description: Update brand preferences, sizes, avoid colors, and budget limits.
      security:
        - BearerAuth: []
      tags: [profile]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatar: { type: string }
                physicalTraits: { type: object }
                preferences: { type: object }
      responses:
        200:
          description: Profile updated successfully

  /api/v1/profile/onboarding:
    post:
      summary: Complete 6-Step Onboarding
      description: Save answers from the 6-step personalized onboarding setup.
      security:
        - BearerAuth: []
      tags: [profile]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                physicalTraits: { type: object }
                preferences: { type: object }
                onboardingStep: { type: number, default: 6 }
      responses:
        200:
          description: Onboarding marked completed

  /api/v1/profile/scan-face-body:
    post:
      summary: AI Vision Physical Calibration (Selfie / Portrait Scan)
      description: Upload selfie photo to Gemini Vision to detect Face Shape, Skin Undertone, Color Season, and Body Silhouette.
      security:
        - BearerAuth: []
      tags: [Style Scanner, profile]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                  example: "data:image/jpeg;base64,..."
      responses:
        200:
          description: AI Vision calibration result with physical traits and styling notes

  /api/v1/profile/color-draping:
    get:
      summary: Digital Color Draping Studio Palette
      description: Returns seasonal color swatches, contrast advice, and color categories (power, neutral, caution) tailored to user's calibrated undertone.
      security:
        - BearerAuth: []
      tags: [Style Scanner, profile]
      responses:
        200:
          description: Seasonal color swatches, contrast advice, and color categories

  # COLLECTIONS & CAPSULE WARDROBES
  /api/v1/collections:
    get:
      summary: Fetch all collections created by the authenticated user
      description: Returns all capsule collections created by the authenticated user with item counts and looks.
      security:
        - BearerAuth: []
      tags: [Collections]
      responses:
        200:
          description: List of user collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
    post:
      summary: Create a new capsule wardrobe collection
      description: Create a collection with name, category, description, and cover image.
      security:
        - BearerAuth: []
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Summer Vacation" }
                category: { type: string, example: "Travel" }
                description: { type: string, example: "Linen and shorts" }
                coverImage: { type: string, example: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e" }
      responses:
        201:
          description: Returns the created collection object
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Collection'

  /api/v1/collections/{id}:
    get:
      summary: Get collection by ID with populated items and outfits
      description: Fetch specific collection by ID with populated items and outfits.
      security:
        - BearerAuth: []
      tags: [Collections]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Collection details with populated items and outfits
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Collection'
        404:
          description: Collection not found
    put:
      summary: Update collection details
      description: Update name, description, category, or cover image of an existing collection.
      security:
        - BearerAuth: []
      tags: [Collections]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Workwear Capsule - Updated" }
                description: { type: string, example: "Curated monochrome workwear" }
                category: { type: string, example: "Work" }
                coverImage: { type: string, example: "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f" }
      responses:
        200:
          description: Updated collection object
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Collection'
    delete:
      summary: Delete a collection
      description: Permanently remove collection from user capsule wardrobes.
      security:
        - BearerAuth: []
      tags: [Collections]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Collection deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Collection deleted" }

  /api/v1/collections/{id}/items:
    post:
      summary: Add items or outfits to collection
      description: Add wardrobe items and outfits to a collection.
      security:
        - BearerAuth: []
      tags: [Collections]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemIds:
                  type: array
                  items: { type: string }
                  example: ["item_1", "item_2"]
                outfitIds:
                  type: array
                  items: { type: string }
                  example: []
      responses:
        200:
          description: Updated collection object with new items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Collection'


  # CAPSULE WARDROBE & AI VISION CLASSIFIER
  /api/v1/wardrobe/analyze:
    post:
      summary: Auto-Analyze Wardrobe Item Image with Gemini Vision
      description: Upload a photo of a clothing item (shirt, pant, shoes, jacket, etc.) to automatically extract name, category, subcategory, primary color, hex code, pattern, fabric, formality, season, and fashion tags.
      security:
        - BearerAuth: []
      tags: [wardrobe]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Uploaded garment or accessory photo
          application/json:
            schema:
              type: object
              properties:
                imageUrl:
                  type: string
                  description: Direct image URL or base64 Data URI
      responses:
        200:
          description: AI classification and color analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      name: { type: string, example: "Navy Blue Oxford Cotton Shirt" }
                      category: { type: string, example: "Tops" }
                      subcategory: { type: string, example: "Oxford Shirt" }
                      color: { type: string, example: "Navy Blue" }
                      colorHex: { type: string, example: "#1B263B" }
                      pattern: { type: string, example: "Solid" }
                      fabric: { type: string, example: "Cotton" }
                      formality: { type: string, example: "Smart Casual" }
                      season: { type: string, example: "All-Season" }
                      tags: { type: array, items: { type: string } }
                      confidence: { type: string, example: "96%" }
                      imageUrl: { type: string }

  /api/v1/wardrobe:
    get:
      summary: Get Capsule Wardrobe Items
      description: Retrieve user wardrobe items with optional filters by category, search term, or season.
      security:
        - BearerAuth: []
      tags: [wardrobe]
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [All, Tops, Bottoms, Outerwear, Shoes, Accessories, Eyewear, One-Piece] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: season
          schema: { type: string }
      responses:
        200:
          description: List of wardrobe items with virtual cost-per-wear
    post:
      summary: Add New Wardrobe Item
      description: Add an item with category, color, price, brand, and optional image upload.
      security:
        - BearerAuth: []
      tags: [wardrobe]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, category, color]
              properties:
                name: { type: string, example: "Merino Wool Crewneck" }
                category: { type: string, example: "Tops" }
                subcategory: { type: string, example: "Knitwear" }
                brand: { type: string, example: "COS" }
                color: { type: string, example: "Forest Green" }
                colorHex: { type: string, example: "#1E3A2F" }
                price: { type: number, example: 110 }
                season: { type: string, example: "Fall/Winter" }
                image: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [name, category, color]
              properties:
                name: { type: string }
                category: { type: string }
                brand: { type: string }
                color: { type: string }
                price: { type: number }
                imageUrl: { type: string }
      responses:
        201:
          description: Wardrobe item created

  /api/v1/wardrobe/{id}:
    put:
      summary: Update Wardrobe Item
      description: Update details or increment wear count for cost-per-wear tracking.
      security:
        - BearerAuth: []
      tags: [wardrobe]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                category: { type: string }
                wearCount: { type: number }
                price: { type: number }
                isFavorite: { type: boolean }
                image: { type: string, format: binary }
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Wardrobe item updated
    delete:
      summary: Delete Wardrobe Item
      security:
        - BearerAuth: []
      tags: [wardrobe]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Wardrobe item removed

  # PRODUCT ADVISOR (FLAGSHIP)
  /api/v1/products/analyze:
    post:
      summary: FLAGSHIP - Analyze Product with AI Vision
      description: |
        Multimodal evaluation analyzing product screenshot against:
        - User face shape, skin undertone, and body silhouette
        - Capsule wardrobe items compatibility (versatility)
        - Budget ceilings and avoid-color lists
        Returns 0-100 score, BUY/MAYBE/SKIP decision, scoring breakdown, and physical harmony notes.
      security:
        - BearerAuth: []
      tags: [product-advisor]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string, example: "Cashmere Ribbed Cardigan" }
                brand: { type: string, example: "Acne Studios" }
                category: { type: string, example: "Tops" }
                price: { type: number, example: 180 }
                color: { type: string, example: "Warm Oatmeal" }
                description: { type: string, example: "100% Mongolian Cashmere cardigan" }
                image: { type: string, format: binary }
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                brand: { type: string }
                category: { type: string }
                price: { type: number }
                color: { type: string }
                description: { type: string }
                imageUrl: { type: string }
      responses:
        201:
          description: Product evaluated successfully with AI score and compatibility breakdown

  /api/v1/products:
    get:
      summary: Get Evaluated Product History
      description: Returns list of user analyzed shopping items with filters by decision (BUY, MAYBE, SKIP) or category.
      security:
        - BearerAuth: []
      tags: [product-advisor]
      parameters:
        - in: query
          name: decision
          schema: { type: string, enum: [BUY, MAYBE, SKIP] }
        - in: query
          name: category
          schema: { type: string }
      responses:
        200:
          description: List of evaluated products

  /api/v1/products/{id}:
    get:
      summary: Get Single Product Evaluation
      description: Detailed breakdown of an analyzed product.
      security:
        - BearerAuth: []
      tags: [product-advisor]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Product evaluation details

    delete:
      summary: Delete Analyzed Product History
      description: Removes product from evaluation history.
      security:
        - BearerAuth: []
      tags: [product-advisor]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Product removed from analysis history

  /api/v1/products/parse-url:
    post:
      summary: Scrape and Parse Product Webpage URL
      description: Extracts product title, price, brand, and main image from an e-commerce product link.
      security:
        - BearerAuth: []
      tags: [product-advisor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "https://www.zara.com/in/en/merino-sweater-p12345.html" }
      responses:
        200:
          description: Parsed product attributes

  /api/v1/products/{id}/complete-the-look:
    post:
      summary: Product Advisor & Complete The Look
      description: Evaluates a product and pairs it with matching items from the user's wardrobe to create 2-3 outfit combinations.
      security:
        - BearerAuth: []
      tags: [Products, product-advisor]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productData:
                  type: object
                  properties:
                    name: { type: string, example: "Camp Collar Linen Shirt" }
                    category: { type: string, example: "Tops" }
                    price: { type: number, example: 1499 }
      responses:
        200:
          description: Matching wardrobe items and cost-per-wear look breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      matchingWardrobeItems:
                        type: array
                        items: { type: string }
                        example: ["item_1", "item_4"]
                      lookName: { type: string, example: "Smart Weekend Casual" }
                      estimatedWears: { type: number, example: 45 }
                      costPerWear: { type: number, example: 33.3 }

  /api/v1/products/compare:
    post:
      summary: Compare 2+ Products Side-by-Side
      description: Head-to-head AI duel analysis comparing candidate clothing items against wardrobe synergy and cost-per-wear.
      security:
        - BearerAuth: []
      tags: [product-advisor]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productIds:
                  type: array
                  items: { type: string }
                  example: ["prod_101", "prod_102"]
                itemA: { type: object }
                itemB: { type: object }
      responses:
        200:
          description: Side-by-side comparison winner and metrics


  /api/v1/recommendations/gaps:
    get:
      summary: Dedicated Wardrobe Gap Analysis
      description: Automatically inspects user's current wardrobe items (tops, bottoms, shoes, layers) and identifies the top 4 missing capsule pieces with budget-friendly picks (₹499 - ₹1,799).
      security:
        - BearerAuth: []
      tags: [Recommendations, recommendations]
      responses:
        200:
          description: Top missing capsule pieces with curated budget picks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "gap_1" }
                        title: { type: string, example: "Minimalist Clean White Low-Tops" }
                        category: { type: string, example: "Footwear Staple" }
                        multiplier: { type: string, example: "+10 Outfits" }
                        reason: { type: string, example: "Unlocks versatile styling across casual chinos and dark jeans." }
                        priceRange: { type: string, example: "₹799 – ₹1,499" }
