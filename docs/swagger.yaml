  # NOTIFICATIONS & WEB PUSH
  /api/v1/notifications/vapid-key:
    get:
      summary: Get VAPID Public Key
      description: Returns public key used by browser service worker to generate push subscription.
      tags: [Notifications, notifications]
      responses:
        200:
          description: VAPID Public key

  /api/v1/notifications/subscribe:
    post:
      summary: Register Device Push Subscription
      description: Stores browser push subscription endpoint and encryption keys for background notifications.
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        201:
          description: Subscribed successfully

  /api/v1/notifications/unsubscribe:
    post:
      summary: Unsubscribe Device from Push Notifications
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        200:
          description: Unsubscribed

  /api/v1/notifications:
    get:
      summary: Get Notification Feed & History
      description: Returns list of notifications (title, message, type, read, createdAt) with unread filtering.
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      parameters:
        - in: query
          name: unreadOnly
          schema: { type: boolean, example: false }
          description: If true, returns only unread notifications
        - in: query
          name: isRead
          schema: { type: boolean }
      responses:
        200:
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: number, example: 10 }
                  unreadCount: { type: number, example: 2 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "notif_101" }
                        title: { type: string, example: "☀️ Weather Styling Alert" }
                        message: { type: string, example: "24°C and partly cloudy. Your Linen Camp Collar look is ready!" }
                        type: { type: string, example: "weather" }
                        read: { type: boolean, example: false }
                        createdAt: { type: string, format: date-time, example: "2026-10-15T09:30:00Z" }

  /api/v1/notifications/read-all:
    patch:
      summary: Mark All Notifications as Read
      description: Marks all authenticated user notifications as read.
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      responses:
        200:
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "All notifications marked as read" }

  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark Single Notification as Read
      description: Marks a specific notification as read.
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Notification marked as read" }

  /api/v1/notifications/{id}:
    delete:
      summary: Delete Notification
      description: Permanently remove a notification.
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Notification removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Notification deleted" }
                  id: { type: string, example: "notif_101" }

  /api/v1/notifications/test-send:
    post:
      summary: Dispatch Test Push Notification to Current User
      description: Triggers a test push notification to verify background & foreground handling.
      security:
        - BearerAuth: []
      tags: [Notifications, notifications]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                type: { type: string }
                url: { type: string }
      responses:
        200:
          description: Test notification dispatched


