                        date: { type: string, example: "2026-10-15" }
                        temp: { type: string, example: "24°C Partly Cloudy" }
                        items:
                          type: array
                          items: { type: string }

  /api/v1/outfits/{id}:
    delete:
      summary: Delete Saved Outfit
      description: Removes outfit from user lookbook.
      security:
        - BearerAuth: []
      tags: [Outfits, outfit-builder]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Outfit removed from lookbook

  /api/v1/outfits/generate:
    post:
      summary: Daily Stylist - Generate Complete Outfit
      description: Generates a complete 3-4 piece outfit from user's wardrobe matching weather and occasion.
      security:
        - BearerAuth: []
      tags: [Outfits, outfit-builder]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                occasion: { type: string, example: "Work / Smart" }
