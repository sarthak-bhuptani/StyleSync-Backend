  # PURCHASES & CPW TRACKING
  /api/v1/purchases:
    get:
      summary: Purchase History & CPW Tracking
      description: Fetch all recorded clothing purchases with cost-per-wear and feedback.
      security:
        - BearerAuth: []
      tags: [Purchases, purchases]
      responses:
        200:
          description: Purchase history and CPW metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "pur_101" }
                        name: { type: string, example: "Linen Camp Collar Shirt" }
                        brand: { type: string, example: "Snitch" }
                        category: { type: string, example: "Tops" }
                        price: { type: number, example: 1299 }
                        currency: { type: string, example: "₹" }
                        date: { type: string, example: "2026-09-18" }
                        imageUrl: { type: string, example: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c" }
                        wearCount: { type: number, example: 14 }
                        costPerWear: { type: number, example: 92.7 }
                        userRating: { type: number, example: 5 }
                        userFeedback: { type: string, example: "Super breathable, great fit" }
    post:
      summary: Record New Purchase
      description: Logs a new clothing purchase to track budget spending and cost-per-wear.
      security:
        - BearerAuth: []
      tags: [Purchases, purchases]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string, example: "Linen Camp Collar Shirt" }
                price: { type: number, example: 1299 }
                category: { type: string, example: "Tops" }
                brand: { type: string, example: "Snitch" }
                imageUrl: { type: string }
                date: { type: string, example: "2026-10-15" }
                image: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string, example: "Linen Camp Collar Shirt" }
                brand: { type: string, example: "Snitch" }
                category: { type: string, example: "Tops" }
                price: { type: number, example: 1299 }
                imageUrl: { type: string, example: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c" }
                date: { type: string, example: "2026-10-15" }
      responses:
        201:
          description: Returns the created purchase object

  /api/v1/purchases/{id}:
    delete:
      summary: Delete Purchase Record
      description: Removes recorded purchase from history.
      security:
        - BearerAuth: []
      tags: [Purchases, purchases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        200:
          description: Purchase deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  id: { type: string, example: "pur_101" }

  /api/v1/purchases/{id}/feedback:
    patch:
      summary: Update Purchase Feedback & Rating
      description: Refines AI styling memory with real user feedback (rating 1-5, feedback text).
      security:
        - BearerAuth: []
      tags: [Purchases, purchases]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: number, minimum: 1, maximum: 5, example: 5 }
